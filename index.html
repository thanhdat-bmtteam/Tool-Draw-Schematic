<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vẽ sơ đồ khối mạch điện</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e6eaed; --surface:#ffffff; --surface2:#f3f5f7; --ink:#18222c; --muted:#5b6875;
  --line:#d3d9de; --accent:#0b5fa5; --accent-ink:#ffffff; --accent-soft:#e3eef8; --danger:#b3261e;
  --shadow:0 1px 2px rgba(20,30,40,.08);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161b; --surface:#19222a; --surface2:#212c35; --ink:#e4ebf0; --muted:#98a6b3;
    --line:#2c3843; --accent:#5aa9ec; --accent-ink:#0b1620; --accent-soft:#1c3346; --danger:#f2867e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161b; --surface:#19222a; --surface2:#212c35; --ink:#e4ebf0; --muted:#98a6b3;
  --line:#2c3843; --accent:#5aa9ec; --accent-ink:#0b1620; --accent-soft:#1c3346; --danger:#f2867e;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:372px 1fr;height:100%;min-height:0}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 2px 9px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .dot{width:10px;height:10px;border-radius:3px}
.tab .n{font-weight:500;font-size:11px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tabc,var(--accent))}
.pane{flex:1;overflow:auto;padding:14px 16px 24px;min-height:0}
.sec{margin:0 0 16px}
.sec h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.chosen{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.row .nm{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .if{font-size:11.5px;color:var(--muted);white-space:nowrap}
.ib{border:0;background:none;width:28px;height:28px;border-radius:6px;cursor:pointer;color:var(--muted);display:grid;place-items:center;font-size:15px}
.ib:hover{background:var(--line);color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px;padding:10px;border:1px dashed var(--line);border-radius:8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:8px}
.cat{display:flex;flex-direction:column;gap:4px}
.ci{display:flex;gap:10px;align-items:center;padding:6px;border-radius:8px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;width:100%}
.ci:hover{background:var(--surface2);border-color:var(--line)}
.ci svg{flex:none;width:58px;height:40px;background:#fff;border-radius:6px;border:1px solid var(--line)}
.ci b{display:block;font-size:13.5px;font-weight:600}
.ci small{display:block;color:var(--muted);font-size:12px}
.ci .plus{margin-left:auto;font-size:18px;color:var(--accent);padding:0 4px}
.insp{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2);margin-bottom:16px}
.insp h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:6px}
.insp h3 span{flex:1}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin:10px 0 4px}
.f input[type=text],.fi,textarea.fi,select.fi{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
textarea.fi{resize:vertical;min-height:60px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.imgbox{display:flex;gap:10px;align-items:center}
.imgbox .pv{width:92px;height:64px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.imgbox .pv img,.imgbox .pv svg{max-width:100%;max-height:100%}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:12.5px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 4px}
.mcugrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{border:1px solid var(--line);border-radius:9px;padding:6px;background:var(--surface);cursor:pointer;text-align:left}
.mc svg{width:100%;height:auto;display:block;border-radius:5px}
.mc b{display:block;font-size:12.5px;margin-top:4px}
.mc[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.bar .title{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.zoom button{border:0;background:var(--surface);width:32px;height:32px;cursor:pointer;font-size:16px}
.zoom span{min-width:48px;text-align:center;font-size:12.5px;color:var(--muted)}
.stage{flex:1;overflow:auto;padding:18px;min-height:0}
.paper{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12);margin:0 auto;border-radius:4px;transform-origin:top left}
.paper svg{display:block}
.paper [data-uid]{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto}
  aside{order:2;border-right:0;border-top:1px solid var(--line)}
  main{order:1}
  .stage{height:58vh}
  .pane{overflow:visible}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.cloud-st{font-size:12.5px;color:var(--muted);white-space:nowrap}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,94vw);max-height:86vh}
dialog::backdrop{background:rgba(10,16,22,.45)}
.dh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh h2{flex:1;margin:0;font-size:16px}
.db{padding:14px 16px 18px;overflow:auto;max-height:calc(86vh - 56px)}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)}
.pl.cur{border-color:var(--accent)}
.pl .nm{flex:1;min-width:0}
.pl .nm b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:13px;margin-top:8px}
.ok{color:#2e7d32;font-size:13px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:12px}
.gi{position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;aspect-ratio:1;display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:4px}
.gi img{max-width:100%;max-height:100%}
.gi:hover{border-color:var(--accent)}
.gi .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px;display:none}
.gi:hover .x,.gi:focus-within .x{display:block}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){function show(m){var b=document.getElementById('errbar');if(!b){b=document.createElement('div');b.id='errbar';b.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;font:13px/1.4 system-ui,sans-serif;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))';(document.body||document.documentElement).appendChild(b);}b.textContent='Lỗi: '+m+' (chụp dòng này gửi lại để sửa)';}
window.addEventListener('error',function(e){show((e.message||'không rõ')+(e.filename?' @ '+e.filename.split('/').pop()+':'+e.lineno:''));});
window.addEventListener('unhandledrejection',function(e){show(String(e.reason&&e.reason.message||e.reason));});
window.__showErr=show;})();
</script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>Sơ đồ khối mạch điện</h1>
      <p>Chọn linh kiện ở từng khối, sơ đồ tự nối dây theo chân.</p>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </aside>
  <main>
    <div class="bar">
      <input class="title" id="title" placeholder="Tiêu đề sơ đồ (không bắt buộc)">
      <div class="zoom"><button id="zOut" aria-label="Thu nhỏ">−</button><span id="zv">100%</span><button id="zIn" aria-label="Phóng to">+</button><button id="zFit" aria-label="Vừa khung" title="Vừa khung" style="width:auto;padding:0 10px;font-size:12.5px">Vừa</button></div>
      <div class="btns">
        <button class="btn" id="bPreset">Nạp sơ đồ mẫu</button>
        <button class="btn" id="bClear">Xóa hết</button>
        <button class="btn" id="bCloud">Dự án đám mây</button>
        <button class="btn" id="bSave">Tải JSON</button>
        <button class="btn" id="bOpen">Mở JSON</button>
        <button class="btn" id="bSvg">Xuất SVG</button>
        <button class="btn pri" id="bPng">Xuất PNG</button>
      </div>
      <input type="file" id="fOpen" accept=".json,application/json" hidden>
      <input type="file" id="fImg" accept="image/*" hidden>
    </div>
    <div class="bar" style="padding:6px 14px;border-top:0"><span class="cloud-st" id="cst">Đang lưu trên máy này</span></div>
    <div class="stage" id="stage"><div class="paper" id="paper"></div></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="gdlg"><div class="dh"><h2>Kho ảnh</h2><button class="ib" id="gX" aria-label="Đóng">✕</button></div><div class="db" id="gB"></div></dialog>
<input type="file" id="fGal" accept="image/*" multiple hidden>
<dialog id="dlg"><div class="dh"><h2>Dự án trên Supabase</h2><button class="ib" id="dlgX" aria-label="Đóng">✕</button></div><div class="db" id="dlgB"></div></dialog>

<script>
/* ================= ART LIBRARY (drawn in a 160×110 box) ================= */
const DEFS = `<defs>

<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7dc7a"/><stop offset="1" stop-color="#c49a2a"/></linearGradient>

<radialGradient id="gRed" cx=".4" cy=".3" r=".7"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#b40f0f"/></radialGradient>

 breakout:(c='#5b2d91',t='')=>`<rect x="24" y="14" width="112" height="84" rx="8" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>${holes(38,28,5,0,14.5)}

  <text x="112" y="86" font-family="Arial" font-size="12" font-weight="700" fill="rgba(255,255,255,.85)" text-anchor="middle">${t}</text>`,
 dht:()=>`<rect x="36" y="8" width="72" height="80" rx="6" fill="#f2f2f0" stroke="#bbb" stroke-width="2"/>${[0,1,2,3,4].map(r=>[0,1,2,3].map(c=>`<rect x="${46+c*14}" y="${18+r*13}" width="9" height="8" fill="#d0d0cc"/>`).join('')).join('')}
  <rect x="44" y="88" width="56" height="10" fill="#1e5aa8"/><path d="M58 98v10M72 98v10M86 98v10" stroke="#aaa" stroke-width="3"/>`,
 radar:()=>`<g transform="rotate(-14 80 55)"><rect x="4" y="38" width="152" height="34" rx="4" fill="#1d4fa0" stroke="#10306a" stroke-width="2"/>
  <rect x="30" y="47" width="14" height="14" fill="#151515"/><rect x="70" y="46" width="18" height="16" fill="#151515"/><rect x="104" y="48" width="12" height="12" fill="#151515"/>
  ${holes(12,48,3,0,7,2.5)}<path d="M130 44 l8 10 l-8 10 M142 44 l8 10 l-8 10" stroke="#e7c35a" stroke-width="2" fill="none"/><rect x="52" y="44" width="8" height="5" fill="#c9a24a"/><rect x="92" y="64" width="8" height="4" fill="#c9a24a"/></g>`,
 reed:()=>`<rect x="18" y="26" width="56" height="62" rx="8" fill="url(#gDome)" stroke="#c4c8cb" stroke-width="2"/><rect x="84" y="20" width="58" height="68" rx="8" fill="url(#gDome)" stroke="#c4c8cb" stroke-width="2"/>
  <circle cx="30" cy="38" r="4" fill="#d8dcdf"/><circle cx="30" cy="76" r="4" fill="#d8dcdf"/><circle cx="130" cy="32" r="4" fill="#d8dcdf"/><circle cx="130" cy="76" r="4" fill="#d8dcdf"/>`,
 button:()=>`<ellipse cx="80" cy="78" rx="54" ry="20" fill="#1a1a1a"/><rect x="26" y="58" width="108" height="20" fill="#222"/><ellipse cx="80" cy="58" rx="54" ry="18" fill="#2c2c2c"/>
  <rect x="44" y="34" width="72" height="22" fill="#b40f0f"/><ellipse cx="80" cy="56" rx="36" ry="10" fill="#9a0c0c"/><ellipse cx="80" cy="34" rx="36" ry="13" fill="url(#gRed)"/>`,
 buzzer:()=>`<path d="M122 70 C140 76 150 70 158 86" stroke="#d62828" stroke-width="3" fill="none"/><path d="M122 76 C140 84 148 80 156 96" stroke="#111" stroke-width="3" fill="none"/>
  <ellipse cx="72" cy="72" rx="56" ry="22" fill="#111"/><rect x="16" y="44" width="112" height="28" fill="#1a1a1a"/><ellipse cx="72" cy="44" rx="56" ry="22" fill="#2a2a2a"/>

 dfplayer:()=>`<rect x="24" y="8" width="112" height="96" rx="4" fill="#121212" stroke="#333"/>${holes(34,18,8,0,11.5,3.5)}${holes(126,18,8,0,11.5,3.5)}
  <rect x="46" y="22" width="68" height="70" rx="3" fill="url(#gSteel)" stroke="#8a9299"/><rect x="54" y="32" width="52" height="46" rx="2" fill="#9aa2a8"/><text x="80" y="18" font-family="Arial" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">DFPlayer Mini</text>`,

 relay:()=>`<rect x="10" y="16" width="140" height="82" rx="5" fill="#1d5fb0" stroke="#10366a" stroke-width="2"/><rect x="60" y="24" width="56" height="48" rx="2" fill="#2b76d0" stroke="#0e3f80"/>
  <text x="88" y="46" font-family="Arial" font-size="9" fill="#dfeaff" text-anchor="middle">SRD-05VDC</text><text x="88" y="58" font-family="Arial" font-size="8" fill="#dfeaff" text-anchor="middle">10A 250VAC</text>

/* ============ MCU BOARD (drawn at real size) ============ */
function board(v,x,y,w,h,label){
  const V={esp:{c:'#131313',m:true,usb:2},nodemcu:{c:'#141414',m:true,usb:1},uno:{c:'#0f7f8a'},mega:{c:'#0f7f8a'},nano:{c:'#1d5fa8'},bluepill:{c:'#1f4fa6'},pico:{c:'#1f7a3a'}}[v]||{c:'#131313',m:true,usb:1};
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${V.c}" stroke="#000" stroke-opacity=".5" stroke-width="2"/>`;
  const cols=Math.max(8,Math.floor((w-40)/22));
  const hdr=(yy)=>{let t='';for(let i=0;i<cols;i++){const cx=x+22+i*((w-44)/(cols-1));t+=`<rect x="${cx-7}" y="${yy-7}" width="14" height="14" fill="#1f1f1f" stroke="#444"/><circle cx="${cx}" cy="${yy}" r="3.2" fill="url(#gGold)"/>`;}return t;};
  s+=hdr(y+18)+hdr(y+36)+hdr(y+h-36)+hdr(y+h-18);
  const my=y+52, mh=h-104;
  if(v==='uno'||v==='mega'){
    s+=`<rect x="${x-8}" y="${my+6}" width="54" height="${Math.min(60,mh*.35)}" fill="url(#gSteel)" stroke="#777"/><rect x="${x-6}" y="${my+mh-Math.min(50,mh*.3)-6}" width="46" height="${Math.min(50,mh*.3)}" fill="#1a1a1a"/>`;
    s+=`<rect x="${x+w*.42}" y="${my+mh*.52}" width="${w*.46}" height="${Math.min(40,mh*.22)}" rx="3" fill="#1a1a1a"/><ellipse cx="${x+w*.3}" cy="${my+mh*.35}" rx="16" ry="7" fill="url(#gSteel)"/>`;
    s+=`<text x="${x+w*.62}" y="${my+mh*.34}" font-family="Arial" font-size="26" font-weight="700" fill="#e9fbff" text-anchor="middle">${esc(label)}</text>`;
  } else if(v==='nano'||v==='bluepill'||v==='pico'){
    s+=`<rect x="${x-8}" y="${my+mh/2-16}" width="40" height="32" rx="3" fill="url(#gSteel)" stroke="#777"/>`;
    const q=Math.min(mh*.7,120);
    s+=`<rect x="${x+w/2-q/2}" y="${my+mh/2-q/2}" width="${q}" height="${q}" rx="4" fill="#161616" transform="rotate(45 ${x+w/2} ${my+mh/2})"/><text x="${x+w/2}" y="${my+mh/2+6}" font-family="Arial" font-size="16" font-weight="700" fill="#cfcfcf" text-anchor="middle">${esc(label)}</text>`;
    s+=`<rect x="${x+w-80}" y="${my+10}" width="22" height="14" fill="#f1f1f1"/><rect x="${x+w-80}" y="${my+mh-24}" width="22" height="14" fill="#e53935"/>`;
  } else {
    const n=V.usb||1;
    for(let i=0;i<n;i++){const uy=my+(mh/(n+1))*(i+1)-20;s+=`<rect x="${x-10}" y="${uy}" width="48" height="40" rx="5" fill="url(#gSteel)" stroke="#777"/><rect x="${x-4}" y="${uy+14}" width="36" height="12" rx="4" fill="#333"/><rect x="${x+62}" y="${uy+6}" width="20" height="28" rx="3" fill="#ddd"/><rect x="${x+66}" y="${uy+12}" width="12" height="16" rx="2" fill="#d32f2f"/>`;}
    const mx=x+w*.5, mw=w*.36, mmy=my+mh*.08, mmh=mh*.84;
    s+=`<rect x="${mx}" y="${mmy}" width="${mw}" height="${mmh}" rx="4" fill="url(#gSteel)" stroke="#6f777d" stroke-width="2"/>`;
    s+=`<path d="M${mx+mw+2} ${mmy+10} h14 v${mmh*.2} h-10 v${mmh*.2} h10 v${mmh*.2} h-10" stroke="#e0c060" stroke-width="3" fill="none"/>`;
    s+=`<text x="${mx+mw/2}" y="${mmy+mmh/2}" font-family="Arial" font-size="${Math.min(22,mw/7)}" font-weight="700" fill="#4a4f54" text-anchor="middle" transform="rotate(90 ${mx+mw/2} ${mmy+mmh/2})">${esc(label)}</text>`;
    for(let i=0;i<5;i++) s+=`<rect x="${x+100+i*22}" y="${my+mh*.45}" width="12" height="18" fill="#2a2a2a"/>`;
  }
  return s;
}

/* ============ TEXT HELPERS ============ */
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const FF='Arial, Helvetica, sans-serif';
const mctx=document.createElement('canvas').getContext('2d');
function tw(t,size,bold=true){mctx.font=(bold?'bold ':'')+size+'px Arial, Helvetica, sans-serif';return mctx.measureText(t).width;}
function wrap(text,maxW,size,bold){
  const out=[]; String(text||'').split('\n').forEach(par=>{let line='';par.split(/\s+/).filter(Boolean).forEach(w=>{const tst=line?line+' '+w:w;if(tw(tst,size,bold)<=maxW||!line)line=tst;else{out.push(line);line=w;}});if(line)out.push(line);});
  return out;
}
function fitSize(text,maxW,size,min=14){while(size>min&&tw(text,size)>maxW)size--;return size;}

/* ============ PIN SEMANTICS ============ */
const COL={power:{f:'#e21f26',t:'#fff',w:'#e21f26'},gnd:{f:'#141414',t:'#fff',w:'#141414'},yellow:{f:'#f7d51d',t:'#1a1a1a',w:'#f0c300'},green:{f:'#5cc24a',t:'#0b2607',w:'#2e9e3e'},blue:{f:'#2f7de1',t:'#fff',w:'#2f7de1'},orange:{f:'#f59a23',t:'#1a1a1a',w:'#f08c00'}};
function pinKind(l){const u=l.toUpperCase();
  if(/GND/.test(u))return'gnd'; if(/^(VCC|VIN|VDD|V\+|\d+(\.\d+)?V)/.test(u))return'power';
  if(/^(RX|SCL|MISO|ECHO|C\d)/.test(u))return'green'; if(/^(SCK|CLK|PWM|ENA|ENB)/.test(u))return'blue'; if(/^(CS|SS|AOUT|A\d|ANALOG|IN2)/.test(u))return'orange'; return'yellow';}
function toModule(l,group){const u=l.toUpperCase();
  if(group==='in') return /^(RX|SCL|SCK|MOSI|CS|SS|TRIG|DIN|R\d)/.test(u);
  return !/^(TX|MISO|ECHO|OUT)/.test(u);}

/* ============ DIAGRAM RENDER ============ */
const W=1540, LX=8, LW=510, CX=532, CW=476, RXp=1022, RW=510;
const PANEL={in:{c:'#1976d2',t:'ĐẦU VÀO (CẢM BIẾN)'},out:{c:'#2e9e3e',t:'ĐẦU RA (THIẾT BỊ CHẤP HÀNH)'},power:{c:'#c62828',t:'KHỐI NGUỒN'},mcu:{c:'#f5b400',t:'VI ĐIỀU KHIỂN TRUNG TÂM',tc:'#1a1a1a'},link:{c:'#6a2fb0',t:'KẾT NỐI / ỨNG DỤNG'}};
function panel(x,y,w,h,k){const P=PANEL[k];const light={in:'#eef5fd',out:'#eef8ef',power:'#fdeeee',mcu:'#fff7dc',link:'#f3edfb'}[k];
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${light}" stroke="${P.c}" stroke-width="3"/><path d="M${x} ${y+56} V${y+14} a14 14 0 0 1 14 -14 H${x+w-14} a14 14 0 0 1 14 14 V${y+56} Z" fill="${P.c}"/>
  <text x="${x+w/2}" y="${y+38}" font-family="${FF}" font-size="${fitSize(P.t,w-30,27)}" font-weight="700" fill="${P.tc||'#fff'}" text-anchor="middle">${P.t}</text>`;}
function placeImg(src,a,x,y,w,h){
  if(src) return `<image href="${src}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet"/>`;
  const s=Math.min(w/160,h/110), ox=x+(w-160*s)/2, oy=y+(h-110*s)/2;
  return `<g transform="translate(${ox.toFixed(1)} ${oy.toFixed(1)}) scale(${s.toFixed(4)})">${artSVG(a)}</g>`;}
function arrow(x,y,d,c,s=11){const p={r:[[x,y],[x-s,y-s*.6],[x-s,y+s*.6]],l:[[x,y],[x+s,y-s*.6],[x+s,y+s*.6]],d:[[x,y],[x-s*.6,y-s],[x+s*.6,y-s]],u:[[x,y],[x-s*.6,y+s],[x+s*.6,y+s]]}[d];return `<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="${c}"/>`;}
function pill(x,y,label,anchor){const k=COL[pinKind(label)];const w=Math.ceil(tw(label,17))+22;const x0=anchor==='r'?x-w:x;
  return {w,x0,svg:`<rect x="${x0}" y="${y-14}" width="${w}" height="28" rx="5" fill="${k.f}" stroke="rgba(0,0,0,.45)" stroke-width="1.5"/><text x="${x0+w/2}" y="${y+6}" font-family="${FF}" font-size="17" font-weight="700" fill="${k.t}" text-anchor="middle">${esc(label)}</text>`};}

function cellsLayout(item,x0,x1,y0,cols){
  const cells=[{a:item.art,img:item.img,label:null}].concat((item.acc||[]).map(k=>({a:ACC[k]?.art,label:ACC[k]?.name||k})));
  const gap=34, cw=Math.min(150,(x1-x0-(cols-1)*gap)/cols), ch=100, hasL=cells.length>1, rowH=ch+(hasL?40:0)+34;
  let svg='';const pos=[];
  cells.forEach((c,i)=>{const r=Math.floor(i/cols);let col=i%cols;if(r%2===1)col=cols-1-col;
    const cx=x0+col*(cw+gap), cy=y0+r*rowH; pos.push({cx,cy,r,col});
    svg+=placeImg(c.img,c.a,cx,cy,cw,ch);
    if(c.label){wrap(c.label,cw+20,15,true).slice(0,2).forEach((ln,j)=>svg+=`<text x="${cx+cw/2}" y="${cy+ch+15+j*17}" font-family="${FF}" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">${esc(ln)}</text>`);}
    if(i>0){const p=pos[i-1];const col2='#1e63d6';
      if(p.r===r){const dir=col>p.col?1:-1;const ax=dir>0?p.cx+cw+4:p.cx-4, bx=dir>0?cx-4:cx+cw+4, ay=cy+ch/2;svg+=`<path d="M${ax} ${ay}H${bx-dir*10}" stroke="${col2}" stroke-width="5"/>`+arrow(bx,ay,dir>0?'r':'l',col2,12);}
      else{const ax=cx+cw/2, ay=p.cy+ch+(cells[i-1].label?40:6), by=cy-2;svg+=`<path d="M${ax} ${ay}V${by-10}" stroke="${col2}" stroke-width="5"/>`+arrow(ax,by,'d',col2,12);}}
  });
  const rows=Math.ceil(cells.length/cols);
  return {svg,h:rows*rowH-34};
}

function buildCard(item,side){
  const pins=item.pins||[]; const pinH=pins.length*38-10;
  if(side==='in'){
    const x=22,w=322, tx=x+14, tW=138;
    const ts=fitSize(item.name,tW,22,15); const tl=wrap(item.name,tW,ts,true); const sl=wrap(item.sub,tW,18,false);
    const textH=16+tl.length*(ts+4)+sl.length*22;
    const cl=cellsLayout(item,x+156,x+w-8,0,1);
    const h=Math.max(118,pinH+34,textH+14,cl.h+24);
    return {h,draw(y){
      let s=`<g data-uid="${item.uid}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="#8fb9e8" stroke-width="2"/>`;
      tl.forEach((ln,i)=>s+=`<text x="${tx}" y="${y+30+i*(ts+4)}" font-family="${FF}" font-size="${ts}" font-weight="700" fill="#141414">${esc(ln)}</text>`);
      sl.forEach((ln,i)=>s+=`<text x="${tx}" y="${y+30+tl.length*(ts+4)+4+i*22}" font-family="${FF}" font-size="18" fill="#333">${esc(ln)}</text>`);
      const c2=cellsLayout(item,x+156,x+w-8,y+(h-cl.h)/2,1); s+=c2.svg;
      const py0=y+h/2-pinH/2+9; const ends=[];
      pins.forEach((p,i)=>{const pl=pill(350,py0+i*38,p,'l');s+=pl.svg;ends.push({x:pl.x0+pl.w,y:py0+i*38,label:p});});
      return {svg:s+'</g>',ends};
    }};
  } else {
    const x=1068,w=450, tx=x+14;
    const ts=fitSize(item.name,w-28,22,15); const sl=item.sub?wrap(item.sub,w-28,16,false).slice(0,2):[];
    const hdr=40+sl.length*20;
    const pw=Math.max(0,...pins.map(p=>Math.ceil(tw(p,17))+22));
    const ix0=x+14+pw+30;
    const cols=(item.acc||[]).length?Math.max(1,Math.min(2,Math.floor((x+w-12-ix0+34)/150))):1;
    const cl=cellsLayout(item,ix0,x+w-12,0,cols);
    const h=Math.max(110,hdr+pinH+22,hdr+cl.h+14);
    return {h,draw(y){
      let s=`<g data-uid="${item.uid}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="#fff" stroke="#8fd19a" stroke-width="2"/>`;
      s+=`<text x="${tx}" y="${y+30}" font-family="${FF}" font-size="${ts}" font-weight="700" fill="#141414">${esc(item.name)}</text>`;
      sl.forEach((ln,i)=>s+=`<text x="${tx}" y="${y+52+i*20}" font-family="${FF}" font-size="16" fill="#444">${esc(ln)}</text>`);
      const c2=cellsLayout(item,ix0,x+w-12,y+hdr+(h-hdr-cl.h)/2-4,cols); s+=c2.svg;
      const py0=y+hdr+(h-hdr-pinH)/2+9; const ends=[];
      pins.forEach((p,i)=>{const pl=pill(x+14,py0+i*38,p,'l');s+=pl.svg;ends.push({x:pl.x0,y:py0+i*38,label:p});});
      return {svg:s+'</g>',ends};
    }};
  }
}

      linkSVG+=`<g data-uid="${l.uid}"><rect x="${CX+12}" y="${ry-4}" width="${CW-24}" height="128" fill="transparent"/>`+placeImg(l.imgL,linkArt(l.l),CX+14,ry,100,112)+
        `<path d="M${CX+120} ${ry+62}H${CX+188}" stroke="#2f7de1" stroke-width="4" stroke-dasharray="10 7"/>`+arrow(CX+202,ry+62,'r','#2f7de1',13)+
        `<text x="${CX+160}" y="${ry+48}" font-family="${FF}" font-size="${fitSize(l.via,96,19)}" font-weight="700" fill="#1e63d6" text-anchor="middle">${esc(l.via)}</text>`+
        placeImg(l.imgR,linkArt(l.r),CX+204,ry,96,112)+
        tl.map((ln,i)=>`<text x="${CX+306}" y="${ry+62-(tl.length-1)*11+i*22+6}" font-family="${FF}" font-size="18" fill="#141414">${esc(ln)}</text>`).join('')+`</g>`;
      ry+=134;
    });
    cy=ry+4;
  }
  const bottom=Math.max(L.bottom,R.bottom,cy,top+300)+8;
  // panels behind columns
  let sides=panel(LX,top,LW,bottom-top,'in')+panel(RXp,top,RW,bottom-top,'out');
  if(!S.in.length) sides+=`<text x="${LX+LW/2}" y="${top+120}" font-family="${FF}" font-size="18" fill="#6b7a88" text-anchor="middle">Chưa có cảm biến</text>`;
  if(!S.out.length) sides+=`<text x="${RXp+RW/2}" y="${top+120}" font-family="${FF}" font-size="18" fill="#6b7a88" text-anchor="middle">Chưa có thiết bị đầu ra</text>`;
  if(S.link.length) linkSVG=panel(CX,linkTop,CW,bottom-linkTop,'link')+linkSVG;
  // ---- wires
  function wires(ends,side,group){
    if(!ends.length) return '';
    const n=ends.length, sp=Math.min(14,(bh-70)/Math.max(1,n-1)), tmid=by+bh/2;
    const sorted=ends.slice().sort((a,b)=>a.y-b.y);
    sorted.forEach((e,i)=>e.ty=tmid+(i-(n-1)/2)*sp);
    const down=sorted.filter(e=>e.ty>e.y+0.5), up=sorted.filter(e=>e.ty<e.y-0.5);
    down.forEach((e,i)=>e.r=down.length-1-i); up.forEach((e,i)=>e.r=i);
    const lanes=Math.max(down.length,up.length,1);
    let s='';
    if(side==='l'){
      const x0=Math.max(...ends.map(e=>e.x))+12, x1=Math.max(Math.max(...ends.map(e=>e.x))+40,Math.min(bx-16,CX+4)), lsp=Math.max(2.5,Math.min(9,(x1-x0)/lanes));
      sorted.forEach(e=>{const c=COL[pinKind(e.label)].w;const toM=toModule(e.label,group);const lx=x0+(e.r||0)*lsp;
        const sx=e.x+(toM?11:0), ex=bx-(toM?0:11);
        s+=`<path d="M${sx} ${e.y}H${lx.toFixed(1)}V${e.ty.toFixed(1)}H${ex}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"/>`;
        s+=toM?arrow(e.x+1,e.y,'l',c,11):arrow(bx,e.ty,'r',c,11);});
    } else {
      const x1=Math.min(...ends.map(e=>e.x))-12, bxr=bx+bw, x0=Math.min(Math.min(...ends.map(e=>e.x))-40,Math.max(bxr+16,CX+CW-4)), lsp=Math.max(2.5,Math.min(9,(x1-x0)/lanes));
      sorted.forEach(e=>{const c=COL[pinKind(e.label)].w;const toM=toModule(e.label,group);const lx=x1-(e.r||0)*lsp;
        const sx=e.x-(toM?11:0), ex=bxr+(toM?0:11);
        s+=`<path d="M${sx} ${e.y}H${lx.toFixed(1)}V${e.ty.toFixed(1)}H${ex}" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"/>`;
        s+=toM?arrow(e.x-1,e.y,'r',c,11):arrow(bxr,e.ty,'l',c,11);});
    }
    return s;
  }
  const wireSVG=wires(L.ends,'l','in')+wires(R.ends,'r','out');
  let sel='';
  if(!forExport&&selUid){sel=`<style>[data-uid="${selUid}"]>rect:first-child{stroke:#ff7a00!important;stroke-width:4!important;stroke-dasharray:10 5}</style>`;}
  const title=S.title?`<text x="${W/2}" y="52" font-family="${FF}" font-size="34" font-weight="700" fill="#141414" text-anchor="middle">${esc(S.title)}</text>`:'';
  const H=Math.ceil(bottom+14);
  lastSVG={w:W,h:H};
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${DEFS}${sel}<rect width="${W}" height="${H}" fill="#ffffff"/>${title}${sides}${powerSVG}${mcuSVG}${linkSVG}${L.svg}${R.svg}${wireSVG}</svg>`;
}

/* images */
let pendingSlot='img';
function resizeImage(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=640,sc=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  let type='image/webp';if(!c.toDataURL(type).startsWith('data:image/webp'))type='image/png';c.toBlob(bl=>bl?res({blob:bl,type,dataURL:c.toDataURL(type,.88)}):rej(new Error('resize')),type,.88);};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Không đọc được tệp ảnh này'));};im.src=url;});}
async function loadImage(file,cb){
  try{const r=await resizeImage(file);
    if(cloudReady()){try{const u=await uploadToStore(r.blob,r.type,file.name||'anh');cb(u);return;}catch(e){toast('Không tải lên kho được ('+(e.message||e)+'), dùng ảnh trên máy.');}}
    cb(r.dataURL);
  }catch(e){toast(e.message||'Không đọc được ảnh');}
}
$('fImg').onchange=e=>{const file=e.target.files[0];if(!file)return;const f=findItem(selUid);if(!f)return;loadImage(file,d=>{f.it[pendingSlot]=d;refresh();toast('Đã thay ảnh');});};
document.addEventListener('paste',e=>{if(!selUid)return;const f=findItem(selUid);if(!f)return;const item=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(!item)return;e.preventDefault();loadImage(item.getAsFile(),d=>{f.it[f.g==='link'?'imgR':'img']=d;refresh();toast('Đã dán ảnh vào '+(f.it.name||'mục đang chọn'));});});

/* project + export */
function saveFile(name,data,type){
  const blob=data instanceof Blob?data:new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Đã tải '+name);
}
const fname=ext=>((S.title||'so-do-khoi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'so-do-khoi')+'.'+ext;
async function inlineRemote(svg){
  const urls=[...new Set([...svg.matchAll(/href="(https?:[^"]+)"/g)].map(m=>m[1]))];
  for(const u of urls){try{const r=await fetch(u.replace(/&amp;/g,'&'),{mode:'cors'});const bl=await r.blob();const d=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(bl);});svg=svg.split('href="'+u+'"').join('href="'+d+'"');}catch(e){}}
  return svg;
}
$('bSvg').onclick=async()=>{toast('Đang chuẩn bị SVG…');saveFile(fname('svg'),await inlineRemote(render(true)),'image/svg+xml');};
$('bPng').onclick=async()=>{
  toast('Đang tạo PNG…');const svg=await inlineRemote(render(true));const {w,h}=lastSVG;const im=new Image();
  im.onload=()=>{const sc=2,c=document.createElement('canvas');c.width=w*sc;c.height=h*sc;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{if(b)saveFile(fname('png'),b,'image/png');else toast('Không tạo được ảnh PNG.');},'image/png');};
  im.onerror=()=>toast('Không tạo được ảnh PNG. Hãy thử Xuất SVG.');
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};

$('fOpen').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.mcu||!Array.isArray(d.in))throw 0;S=d;selUid=null;refresh();toast('Đã mở dự án');}catch(err){toast('Tệp này không phải dự án sơ đồ khối.');}});};
$('bPreset').onclick=()=>{S=presetState();selUid=null;zoom=null;refresh();toast('Đã nạp sơ đồ mẫu');};
$('bClear').onclick=()=>{S=emptyState();selUid=null;refresh();};

/* ============ SUPABASE ============ */
const CFG=window.APP_CONFIG||{};
const BUCKET=CFG.STORAGE_BUCKET||'images';
let cfgProblem='';
const sb=(()=>{const url=(CFG.SUPABASE_URL||'').trim(),key=(CFG.SUPABASE_ANON_KEY||'').trim();
  if(!url&&!key)return null;
  if(/^sb_secret_/.test(key)){cfgProblem='config.js đang dùng SECRET key. Hãy thu hồi key đó trong Supabase và thay bằng Publishable key (sb_publishable_...).';return null;}
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(url)){cfgProblem='SUPABASE_URL không đúng dạng https://xxxx.supabase.co';}
  if(!window.supabase){cfgProblem='Không tải được thư viện Supabase (kiểm tra mạng hoặc trình chặn quảng cáo).';return null;}
  try{return window.supabase.createClient(url.replace(/\/$/,''),key);}catch(e){cfgProblem='Không khởi tạo được Supabase: '+e.message;return null;}})();
const cloudReady=()=>!!(sb&&sess);
async function uploadToStore(blob,type,orig){
  const ext=type==='image/webp'?'webp':'png';
  const base=(orig||'anh').replace(/\.[^.]+$/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase().slice(0,40)||'anh';
  const path=`${sess.user.id}/${Date.now().toString(36)}-${base}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:type,cacheControl:'31536000',upsert:false});
  if(error)throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function migrateImages(){
  const list=[S.mcu,...S.power,...S.in,...S.out,...S.link];let n=0;
  for(const it of list)for(const k of ['img','imgL','imgR']){const v=it&&it[k];if(v&&v.startsWith('data:')){const bl=await (await fetch(v)).blob();it[k]=await uploadToStore(bl,bl.type||'image/png',(it.name||it.via||'anh'));n++;}}
  return n;
}
/* gallery */
let galSlot='img';
async function openGallery(slot){galSlot=slot||'img';$('gdlg').showModal();renderGallery();}
async function renderGallery(msg){
  const B=$('gB');
  if(!sb){B.innerHTML=`<p>${esc(cfgProblem||'Chưa cấu hình Supabase trong config.js.')}</p><p class="hint">Vẫn có thể dùng nút "Tải ảnh lên…" để chèn ảnh từ máy.</p>`;return;}
  if(!sess){B.innerHTML=`<p>Đăng nhập để dùng kho ảnh trên Supabase.</p><button class="btn pri" id="gLogin">Đăng nhập</button>`;$('gLogin').onclick=()=>{$('gdlg').close();openDlg();};return;}
  B.innerHTML=`<div class="btns"><button class="btn pri" id="gUp">Tải ảnh lên kho…</button></div><p class="hint">Chọn một ảnh để gán cho linh kiện đang chọn. Ảnh được thu về tối đa 640px.</p>${msg?`<div class="${msg.err?'err':'ok'}">${esc(msg.t)}</div>`:''}<div class="gal" id="gGrid"><div class="hint">Đang tải…</div></div>`;
  $('gUp').onclick=()=>{$('fGal').value='';$('fGal').click();};
  const {data,error}=await sb.storage.from(BUCKET).list(sess.user.id,{limit:500,sortBy:{column:'created_at',order:'desc'}});
  const G=$('gGrid');if(!G)return;
  if(error){G.innerHTML=`<div class="err">Không đọc được kho ảnh: ${esc(error.message)}. Kiểm tra đã chạy phần Storage trong schema.sql chưa.</div>`;return;}
  const files=(data||[]).filter(f=>f.id&&f.name!=='.emptyFolderPlaceholder');
  G.innerHTML=files.length?files.map(f=>{const u=sb.storage.from(BUCKET).getPublicUrl(sess.user.id+'/'+f.name).data.publicUrl;return `<div class="gi" data-u="${esc(u)}" title="${esc(f.name)}" tabindex="0"><img src="${esc(u)}" alt="" loading="lazy"><button class="x" data-rm="${esc(f.name)}" aria-label="Xóa ảnh">✕</button></div>`}).join(''):'<div class="empty" style="grid-column:1/-1">Kho ảnh trống. Bấm "Tải ảnh lên kho…" để thêm.</div>';
  G.onclick=async e=>{const rm=e.target.closest('[data-rm]');if(rm){e.stopPropagation();if(!confirm('Xóa ảnh này khỏi kho? Sơ đồ đang dùng ảnh này sẽ mất hình.'))return;const {error}=await sb.storage.from(BUCKET).remove([sess.user.id+'/'+rm.dataset.rm]);renderGallery(error?{err:1,t:error.message}:{t:'Đã xóa ảnh'});return;}
    const g=e.target.closest('[data-u]');if(!g)return;const f=findItem(selUid);if(!f){toast('Hãy chọn một linh kiện trước');return;}f.it[galSlot]=g.dataset.u;$('gdlg').close();refresh();toast('Đã gán ảnh');};
}
$('fGal').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;let ok=0,err='';$('gGrid')&&($('gGrid').innerHTML='<div class="hint">Đang tải lên '+files.length+' ảnh…</div>');
  for(const f of files){try{const r=await resizeImage(f);await uploadToStore(r.blob,r.type,f.name);ok++;}catch(x){err=x.message||String(x);}}
  renderGallery(err?{err:1,t:`Tải lên ${ok}/${files.length} ảnh. Lỗi: ${err}`}:{t:`Đã tải lên ${ok} ảnh`});};
$('gX').onclick=()=>$('gdlg').close();
let cur={id:localStorage.getItem('sodokhoi.pid')||null,name:localStorage.getItem('sodokhoi.pname')||''}, sess=null, dirty=false, busy=false;
function setCur(id,name){cur={id,name};try{id?localStorage.setItem('sodokhoi.pid',id):localStorage.removeItem('sodokhoi.pid');localStorage.setItem('sodokhoi.pname',name||'')}catch(e){}showStatus();}
function showStatus(msg){const el=$('cst');if(msg){el.textContent=msg;return;}
  if(!sb){el.textContent=cfgProblem?('⚠ '+cfgProblem):'Đang lưu trên máy này (chưa cấu hình Supabase)';return;}
  if(!sess){el.textContent='Chưa đăng nhập – dữ liệu chỉ lưu trên máy này';return;}
  el.textContent=cur.id?('Dự án: '+(cur.name||'không tên')+(dirty?' • có thay đổi chưa lưu (Ctrl+S)':' • đã lưu')):'Bản nháp chưa lưu lên đám mây (Ctrl+S để lưu)';}
const _save=save; save=function(){_save();if(!dirty){dirty=true;showStatus();}};
const fmt=t=>new Date(t).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
async function cloudSave(asNew){
  if(!sb||!sess){openDlg();return;}
  if(busy)return;busy=true;showStatus('Đang lưu…');
  try{
    const mig=await migrateImages();if(mig)toast('Đã chuyển '+mig+' ảnh lên kho');
    const name=(S.title||cur.name||'Sơ đồ khối').trim();
    if(cur.id&&!asNew){const {error}=await sb.from('projects').update({name,data:S,updated_at:new Date().toISOString()}).eq('id',cur.id);if(error)throw error;setCur(cur.id,name);}
    else{const {data,error}=await sb.from('projects').insert({name,data:S}).select('id').single();if(error)throw error;setCur(data.id,name);}
    dirty=false;showStatus();toast('Đã lưu lên Supabase');if($('dlg').open)renderDlg();
  }catch(e){showStatus();toast('Lưu thất bại: '+(e.message||e));}
  busy=false;
}
async function cloudOpen(id){
  const {data,error}=await sb.from('projects').select('id,name,data').eq('id',id).single();
  if(error){toast('Không mở được: '+error.message);return;}
  S=data.data;selUid=null;zoom=null;setCur(data.id,data.name);refresh();dirty=false;showStatus();$('dlg').close();toast('Đã mở '+data.name);
}
async function cloudDel(id,name){
  if(!confirm('Xóa dự án "'+name+'"? Không thể hoàn tác.'))return;
  const {error}=await sb.from('projects').delete().eq('id',id);
  if(error){toast('Không xóa được: '+error.message);return;}
  if(cur.id===id)setCur(null,'');renderDlg();
}
async function renderDlg(errMsg){
  const B=$('dlgB');
  if(!sb){B.innerHTML=cfgProblem?`<div class="err" style="margin:0">${esc(cfgProblem)}</div>`:`<p>Chưa cấu hình Supabase. Mở tệp <b>config.js</b>, điền <b>SUPABASE_URL</b> và <b>SUPABASE_ANON_KEY</b> của dự án Supabase, rồi tải lại trang.</p><p class="hint">Hướng dẫn chi tiết nằm trong README.md. Khi chưa cấu hình, công cụ vẫn chạy bình thường và lưu trên trình duyệt này.</p>`;return;}
  if(!sess){B.innerHTML=`<label class="f">Email</label><input class="fi" id="em" type="email" autocomplete="email">
    <label class="f">Mật khẩu</label><input class="fi" id="pw" type="password" autocomplete="current-password">
    <div class="btns" style="margin-top:12px"><button class="btn pri" id="bIn">Đăng nhập</button><button class="btn" id="bUp">Tạo tài khoản</button></div>
    ${errMsg?`<div class="err">${esc(errMsg)}</div>`:''}<p class="hint">Dữ liệu mỗi tài khoản là riêng tư, người khác không xem được.</p>`;
    const go=async up=>{const email=$('em').value.trim(),password=$('pw').value;if(!email||!password)return renderDlg('Nhập email và mật khẩu.');
      const r=up?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href.split('#')[0]}}):await sb.auth.signInWithPassword({email,password});
      if(r.error)return renderDlg(r.error.message);
      if(up&&!r.data.session){B.innerHTML='<p>Đã gửi email xác nhận tới <b>'+esc(email)+'</b>. Bấm vào liên kết trong email rồi quay lại đây đăng nhập.</p>';}};
    $('bIn').onclick=()=>go(false);$('bUp').onclick=()=>go(true);$('pw').onkeydown=e=>{if(e.key==='Enter')go(false)};
    return;}
  B.innerHTML=`<p style="margin:0 0 10px">Đăng nhập: <b>${esc(sess.user.email)}</b> <button class="btn sm" id="bOut" style="margin-left:6px">Đăng xuất</button></p>
    <div class="btns"><button class="btn pri" id="bCS">${cur.id?'Lưu thay đổi':'Lưu lên đám mây'}</button><button class="btn" id="bCN">Lưu thành bản mới</button><button class="btn" id="bNew">Sơ đồ trống mới</button><button class="btn" id="bChk">Kiểm tra kết nối</button></div><div id="chk"></div>
    <p class="hint">Tên dự án lấy theo tiêu đề sơ đồ. Phím tắt Ctrl+S để lưu nhanh.</p><h2 style="font-size:13px;color:var(--muted);margin:16px 0 0">Dự án của bạn</h2><div class="plist" id="pls"><div class="hint">Đang tải…</div></div>`;
  $('bOut').onclick=async()=>{await sb.auth.signOut();setCur(null,'');};
  $('bChk').onclick=async()=>{const C=$('chk');C.innerHTML='<p class="hint">Đang kiểm tra…</p>';const r1=await sb.from('projects').select('id').limit(1);const r2=await sb.storage.from(BUCKET).list(sess.user.id,{limit:1});
    C.innerHTML=`<p class="${r1.error?'err':'ok'}">Bảng projects: ${r1.error?esc(r1.error.message):'OK'}</p><p class="${r2.error?'err':'ok'}">Kho ảnh "${BUCKET}": ${r2.error?esc(r2.error.message):'OK'}</p>`;};
  $('bCS').onclick=()=>cloudSave(false);$('bCN').onclick=()=>cloudSave(true);
  $('bNew').onclick=()=>{S=emptyState();selUid=null;setCur(null,'');refresh();$('dlg').close();};
  const {data,error}=await sb.from('projects').select('id,name,updated_at').order('updated_at',{ascending:false});
  const L=$('pls');if(!L)return;
  if(error){L.innerHTML=`<div class="err">Không tải được danh sách: ${esc(error.message)}. Kiểm tra đã chạy supabase/schema.sql chưa.</div>`;return;}
  L.innerHTML=data.length?data.map(p=>`<div class="pl ${p.id===cur.id?'cur':''}"><div class="nm"><b>${esc(p.name)}</b><small>Sửa lần cuối ${fmt(p.updated_at)}</small></div><button class="btn sm" data-o="${p.id}">Mở</button><button class="ib" data-d="${p.id}" data-n="${esc(p.name)}" aria-label="Xóa">✕</button></div>`).join(''):'<div class="empty">Chưa có dự án nào. Bấm "Lưu lên đám mây" để lưu sơ đồ hiện tại.</div>';
  L.onclick=e=>{const o=e.target.closest('[data-o]'),d=e.target.closest('[data-d]');if(o)cloudOpen(o.dataset.o);if(d)cloudDel(d.dataset.d,d.dataset.n);};
}
function openDlg(){renderDlg();$('dlg').showModal();}
$('bCloud').onclick=openDlg;$('dlgX').onclick=()=>$('dlg').close();
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();cloudSave(false);}});
if(sb){sb.auth.getSession().then(({data})=>{sess=data.session;showStatus();});sb.auth.onAuthStateChange((_e,s2)=>{sess=s2;showStatus();if($('dlg').open)renderDlg();});}
window.addEventListener('beforeunload',e=>{if(sb&&sess&&dirty){e.preventDefault();e.returnValue='';}});
dirty=false;

renderTabs();renderPane();$('title').value=S.title||'';showStatus();
requestAnimationFrame(()=>{renderDiagram();});
</script>
</body>
</html>
